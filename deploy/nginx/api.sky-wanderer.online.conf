# Sky Wanderer API only. Install as its own Nginx site.
# Do not merge this server block into Timia's config.
# DNS A: api.sky-wanderer.online -> 124.222.228.215
# Certificate comes later; this file listens on port 80 until then.
# The API container publishes 127.0.0.1:8788. Change SKY_BIND_PORT and this proxy_pass together.

server {
    listen 80;
    listen [::]:80;
    server_name api.sky-wanderer.online;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
